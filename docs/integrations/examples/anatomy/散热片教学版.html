示 · 可拖动进度或使用方向键。非温度、受力或运动仿真，科学含义请教师核对。</p><section aria-label="课堂讲解"><p>八年级 · 学习目标：比较接触空气的面积，解释散热片的作用</p><h2>先观察</h2><p class="student">比较平整底板和多片肋片，哪种接触空气的面积更大？</p><div class="lessons"><button type="button" data-lesson="0" data-part="底板">讲解1 · 底板</button><button type="button" data-lesson="1" data-part="散热肋片">讲解2 · 散热肋片</button></div><p id="lesson-explanation" class="student"></p><p id="lesson-question" class="student"></p><h2>想一想</h2><p class="student">同样材料和温差下，为什么散热片通常设计成许多薄肋片？</p><details><summary>教师讲解建议与参考答案</summary><p>讲解1 · 底板：先请学生指出热源与底板的接触面，不把热量传递说成温度流动。</p><p>讲解2 · 散热肋片：提醒学生还受空气流动、温差和材料影响，不能只凭片数判断散热快慢。</p><p>参考答案专属：增大与空气接触的面积，在其他条件相近时有助于散热。</p></details></section></main><script id="science-data" type="application/octet-stream">PCEtLSB4aWFvemhpLnNjaWVuY2UtZmlndXJlLnYxIC0tPgo8c3ZnIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgY2xhc3M9Imlzby1zdmcgaXNvIiBkYXRhLXRoZW1lPSJsaWdodCIgdmlld0JveD0iMCAwIDk2MCA2ODQiIHJvbGU9ImltZyIgYXJpYS1sYWJlbD0i5pWj54Ot54mH5Li65LuA5LmI5pyJ5b6I5aSa6IKL54mHIj48c3R5bGU+Ci5pc297CiAgLS1hbmF0b215LXBhZ2U6IzBiMGIwYjstLWFuYXRvbXktY2FyZDojMTMxMzEzOy0tYW5hdG9teS10ZXh0OiNhM2EzYTM7LS1hbmF0b215LXN0cm9uZzojZTZlNmU2Oy0tYW5hdG9teS1tdXRlZDojNmU2ZTZlOwogIC0tYW5hdG9teS1wYXBlcjojMTMxMzEzOy0tYW5hdG9teS1mYWNlOiMxYjFiMWI7LS1hbmF0b215LXRvcDojMWMxYzFjOwogIC0tYW5hdG9teS1zaGFkZS0wOiMwZjBmMGY7LS1hbmF0b215LXNoYWRlLTE6IzEyMTIxMjstLWFuYXRvbXktc2hhZGUtMjojMTUxNTE1Oy0tYW5hdG9teS1zaGFkZS0zOiMxODE4MTg7CiAgLS1hbmF0b215LWxpdC10b3A6IzI2MjYyNjstLWFuYXRvbXktbGl0LXNoYWRlOiMxZDFkMWQ7CiAgLS1hbmF0b215LWhpOiNkNGQ0ZDQ7LS1hbmF0b215LW1pZDojNmE2YTZhOy0tYW5hdG9teS1sbzojM2UzZTNlOy0tYW5hdG9teS1mYWludDojMmEyYTJhOy0tYW5hdG9teS1saXQ6I2ZmZmZmZjsKICAtLWFuYXRvbXktaGFsbzojMDUwNTA1Oy0tYW5hdG9teS1oYWxvLW9wYWNpdHk6Ljk7LS1hbmF0b215LWRvdDojZTZlNmU2OwogIC0tYW5hdG9teS1yZWQ6I2ZmNmI2YjstLWFuYXRvbXktZ3JlZW46IzZiZTBhMDstLWFuYXRvbXktYmx1ZTojNmI5YmZmOwogIC0tYW5hdG9teS13ZWlnaHQ6LjZweDstLWFuYXRvbXktZWFzZTpjdWJpYy1iZXppZXIoLjMyLC43MiwwLDEpOwogIC0tYW5hdG9teS1tb25vOnVpLW1vbm9zcGFjZSwiU0YgTW9ubyIsTWVubG8sQ29uc29
