appId: com.omniedu.xiaozhi
productName: 小智
copyright: Copyright © 2026 OmniEdu
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - out/main/*.py
  - out/main/vendor/**/*
extraResources:
  - from: .local-release/python-embed
    to: python-embed
    filter:
      - "**/*"
  - from: .local-ocr/resume-v2-dist/omni-edu-ocr
    to: ocr-runtime
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: 小智-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 小智
  deleteAppDataOnUninstall: false
  runAfterFinish: false
